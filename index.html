<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5DA8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Касса тренера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: phone app — day timeline / clients / stats views, quick buttons + tab bar fixed at the bottom, forms in a bottom sheet */
:root{
  --bg:#EEF2EF; --card:#FFFFFF; --ink:#13261F; --muted:#5D6F67; --line:#D5DED9;
  --court:#2F5DA8; --court-ink:#FFFFFF; --ball:#D9E04B; --plus:#1F7A4D; --minus:#C2412D; --soft:#E3EAE6;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --onbg:var(--ink); --onbgm:var(--muted); --sheet:var(--bg); --pattern:none; --psize:auto; --sel:var(--court); --sel-ink:var(--court-ink); --dot:var(--court);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --card:#17241F; --ink:#E6EEEA; --muted:#93A69D; --line:#2A3A33;
  --court:#5B86D1; --court-ink:#0B1420; --ball:#C9D23F; --plus:#4FBF86; --minus:#EE7A63; --soft:#1F2F28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1915; --card:#17241F; --ink:#E6EEEA; --muted:#93A69D; --line:#2A3A33;
  --court:#5B86D1; --court-ink:#0B1420; --ball:#C9D23F; --plus:#4FBF86; --minus:#EE7A63; --soft:#1F2F28; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:transparent;color:var(--ink)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background-color:var(--bg);background-image:var(--pattern);background-size:var(--psize)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:170px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:20px;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:15px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--court);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.linkbtn{background:none;border:0;color:var(--court);font-weight:600;padding:4px 0}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere}
.bal{font-weight:600}
.pos{color:var(--plus)} .neg{color:var(--minus)} .zero{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.debt{background:color-mix(in srgb,var(--minus) 16%,transparent);color:var(--minus)}
.pill.todo{background:var(--ball);color:#1d2208}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{border:0;border-radius:12px;padding:13px 10px;font-weight:600;font-size:15px}
.big.train{background:var(--court);color:var(--court-ink)}
.big.pay{background:var(--ink);color:var(--card)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{background:none;border:0;padding:8px;border-radius:10px;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{background:var(--soft);color:var(--ink)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar .arrow{background:var(--card);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:18px;flex:none}
.bar h2{text-align:center;flex:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lab{font-size:12px;color:var(--muted);letter-spacing:.02em}
.tile .val{font-family:var(--display);font-weight:500;font-size:19px}
.tile.net{grid-column:1/-1;background:var(--court);color:var(--court-ink)}
.tile.net .lab{color:inherit;opacity:.85}
.tile.net .val{font-size:26px}
.formula{font-size:12px;color:var(--muted)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.mini{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.mini.ok{background:var(--plus);border-color:var(--plus);color:#fff}
/* week strip + timeline */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dayhead h1{margin:0}
.week{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;align-items:center;gap:2px}
.week .arr{background:none;border:0;font-size:20px;color:var(--muted);padding:0;height:56px}
.wd{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.wd small{font-size:12px;color:var(--muted)}
.wd b{font-size:16px;font-weight:600;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.wd.today b{color:var(--court);background:var(--card)}
.wd.sel b{background:var(--sel);color:var(--sel-ink)}
.wd i{width:5px;height:5px;border-radius:50%;background:var(--dot);opacity:0}
.wd.has i{opacity:1}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:52px 18px 1fr;gap:8px;align-items:stretch}
.tli .t{font-variant-numeric:tabular-nums;color:var(--muted);padding-top:14px;font-size:14px}
.tli .rail{display:flex;flex-direction:column;align-items:center}
.tli .rail .dot{width:16px;height:16px;border-radius:50%;background:var(--plus);margin-top:15px;display:grid;place-items:center;color:#fff;font-size:10px;line-height:1}
.tli .rail .ln{flex:1;width:2px;background:var(--line);margin-top:4px}
.tli:last-child .rail .ln{visibility:hidden}
.tcard{background:var(--card);border:0;border-radius:12px;padding:11px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-width:0}
.tcard .main{flex:1;min-width:0}
.tcard .name{font-weight:600;overflow-wrap:anywhere}
.tli.plan .rail .dot{background:var(--card);border:2px solid var(--muted);color:transparent}
.tcard.plan{background:color-mix(in srgb,var(--card) 72%,transparent);border:1.5px dashed var(--muted)}
.tcard.plan .name{color:var(--ink)}
.wd.planned i{opacity:1;background:transparent;box-shadow:0 0 0 1.5px var(--dot) inset}
.wd.has i{background:var(--dot);box-shadow:none}
.daysum{background:var(--card);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.daysum .big-v{font-family:var(--display);font-size:22px;font-weight:500}
/* stats chart */
.chart{background:var(--card);border-radius:14px;padding:12px 12px 8px}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line)}
.bars button{flex:1;min-width:0;height:100%;background:none;border:0;padding:0;display:flex;align-items:flex-end}
.bars button span{display:block;width:100%;background:var(--court);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.bars button.zero span{background:var(--line)}
.blabels{display:flex;gap:2px;margin-top:4px}
.blabels span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden}
/* folders */
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:4px 2px;width:100%;text-align:left}
.ghead h2{font-size:14px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px}
.emojis button[aria-pressed="true"]{border-color:var(--court);box-shadow:0 0 0 2px var(--court) inset}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;max-height:92%;overflow:auto;background:var(--sheet);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{background:var(--soft);border:0;border-radius:999px;width:34px;height:34px;font-size:18px;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px}
.chips button[aria-pressed="true"]{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.chips.groups button{background:var(--soft);border-color:transparent;font-weight:600}
.att{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:6px 6px 6px 12px}
.att span{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.att input{width:110px;text-align:right}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:10px;padding:10px 12px}
.toggle input{width:22px;height:22px;accent-color:var(--court);flex:none}
.save{background:var(--court);color:var(--court-ink);border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px}
.save:disabled{opacity:.5}
.danger{background:none;border:1px solid var(--minus);color:var(--minus);border-radius:12px;padding:12px;font-weight:600}
.danger.armed{background:var(--minus);color:#fff}
.err{color:var(--minus);font-size:13px}
.hero{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.hero .val{font-family:var(--display);font-size:28px;font-weight:500}
.hist .row{padding:10px 14px}
.copy{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px}
.copy code{flex:1;min-width:0;font-family:inherit;overflow-wrap:anywhere}

/* text sitting directly on the page background */
.wrap>section h1,#status,.wd small,.wd b,.week .arr,.tli .t,.sec:not(.in) h2,.ghead h2,.bar h2{color:var(--onbg)}
.sec:not(.in) .sub,.ghead .sub,.wd small,.tli .t{color:var(--onbgm)}
.sec:not(.in) .linkbtn{color:var(--onbg);text-decoration:underline;text-underline-offset:3px}
.wd.today b{color:var(--court);background:var(--card)}
.wd.sel b,.wd.sel.today b{background:var(--sel);color:var(--sel-ink)}
.tli .rail .ln{background:color-mix(in srgb,var(--onbgm) 45%,transparent)}
/* theme picker */
.swgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{border:0;border-radius:14px;padding:10px;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-align:left;background-color:var(--bg);background-image:var(--pattern);background-size:var(--psize);box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--court-pick,#2F5DA8)}
.sw .swc{background:var(--card);color:var(--ink);border-radius:9px;padding:7px 9px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:600;font-size:13px}
.sw .swd{width:14px;height:14px;border-radius:50%;background:var(--court);flex:none}
.sw .swt{color:var(--onbg);font-size:11px;opacity:.9}
/* ---- skins ---- */
.sw[data-skin="classic"]{--bg:#EEF2EF;--onbg:#13261F;--onbgm:#5D6F67;--card:#FFFFFF;--ink:#13261F;--muted:#5D6F67;--line:#D5DED9;--court:#2F5DA8;--pattern:none}
:root[data-skin="hard"],.sw[data-skin="hard"]{--bg:#1F4E8C;--onbg:#FFFFFF;--onbgm:#C4D4EC;--card:#FFFFFF;--ink:#0F2340;--muted:#5B6B82;--line:#D9E1EC;--soft:#E8EEF7;--court:#1F4E8C;--court-ink:#FFFFFF;--ball:#D9E04B;--plus:#1F7A4D;--minus:#C2412D;--sheet:#EEF3FA;--sel:#FFFFFF;--sel-ink:#1F4E8C;--dot:#FFFFFF;--psize:auto;
  --pattern:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.18) 0 calc(50% + 1px),transparent 0),linear-gradient(180deg,transparent calc(40% - 1px),rgba(255,255,255,.18) 0 calc(40% + 1px),transparent 0),linear-gradient(90deg,transparent 10px,rgba(255,255,255,.18) 10px 12px,transparent 12px calc(100% - 12px),rgba(255,255,255,.18) calc(100% - 12px) calc(100% - 10px),transparent 0);color-scheme:light}
:root[data-skin="clay"],.sw[data-skin="clay"]{--bg:#C2603A;--onbg:#FFF7EF;--onbgm:#F7D9C5;--card:#FFF8F1;--ink:#3A1E10;--muted:#8A6450;--line:#EAD7C8;--soft:#F6E6D8;--court:#1F5A3A;--court-ink:#FFFFFF;--ball:#D9E04B;--plus:#1F7A4D;--minus:#B3261E;--sheet:#FBEFE4;--sel:#FFF8F1;--sel-ink:#C2603A;--dot:#FFF7EF;--psize:auto;
  --pattern:repeating-linear-gradient(45deg,rgba(0,0,0,.035) 0 2px,transparent 2px 7px),linear-gradient(180deg,transparent calc(40% - 1px),rgba(255,255,255,.35) 0 calc(40% + 1px),transparent 0),linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.35) 0 calc(50% + 1px),transparent 0);color-scheme:light}
:root[data-skin="grass"],.sw[data-skin="grass"]{--bg:#2F6B3A;--onbg:#FFFFFF;--onbgm:#CFE6D2;--card:#FFFFFF;--ink:#13261A;--muted:#5E7263;--line:#DCE6DD;--soft:#ECF3EC;--court:#5A2D82;--court-ink:#FFFFFF;--ball:#D9E04B;--plus:#1F7A4D;--minus:#C2412D;--sheet:#F1F6F0;--sel:#FFFFFF;--sel-ink:#2F6B3A;--dot:#FFFFFF;--psize:auto;
  --pattern:repeating-linear-gradient(180deg,rgba(255,255,255,.06) 0 56px,transparent 56px 112px);color-scheme:light}
:root[data-skin="ao"],.sw[data-skin="ao"]{--bg:#0A86CF;--onbg:#FFFFFF;--onbgm:#D2ECFA;--card:#FFFFFF;--ink:#0B2742;--muted:#56708A;--line:#D6E6F2;--soft:#E7F3FB;--court:#0A6FB0;--court-ink:#FFFFFF;--ball:#D9E04B;--plus:#1F7A4D;--minus:#C2412D;--sheet:#EAF5FC;--sel:#FFFFFF;--sel-ink:#0A6FB0;--dot:#FFFFFF;--psize:auto;
  --pattern:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.12)),linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.22) 0 calc(50% + 1px),transparent 0),linear-gradient(180deg,transparent calc(30% - 1px),rgba(255,255,255,.22) 0 calc(30% + 1px),transparent 0);color-scheme:light}
:root[data-skin="night"],.sw[data-skin="night"]{--bg:#0B1430;--onbg:#EAF0FF;--onbgm:#9AA8C8;--card:#141F42;--ink:#EAF0FF;--muted:#9AA8C8;--line:#26335C;--soft:#1C2850;--court:#D9E04B;--court-ink:#121A05;--ball:#D9E04B;--plus:#4FBF86;--minus:#F07C66;--sheet:#0F1938;--sel:#D9E04B;--sel-ink:#121A05;--dot:#D9E04B;--psize:auto;
  --pattern:radial-gradient(ellipse at 10% -5%,rgba(255,240,180,.28),transparent 40%),radial-gradient(ellipse at 90% -5%,rgba(255,240,180,.22),transparent 40%),linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.06) 0 calc(50% + 1px),transparent 0);color-scheme:dark}
:root[data-skin="ball"],.sw[data-skin="ball"]{--bg:#DDEB47;--onbg:#1E2408;--onbgm:#4F5A1A;--card:#FFFFFF;--ink:#1E2408;--muted:#626B3C;--line:#E3E8C8;--soft:#F3F7D6;--court:#1E2408;--court-ink:#E4F04F;--ball:#DDEB47;--plus:#1F7A4D;--minus:#C2412D;--sheet:#F7FAE3;--sel:#1E2408;--sel-ink:#E4F04F;--dot:#1E2408;--psize:auto;
  --pattern:radial-gradient(circle at -25% 50%,transparent 58%,rgba(255,255,255,.75) 58% 59.5%,transparent 59.5%),radial-gradient(circle at 125% 50%,transparent 58%,rgba(255,255,255,.75) 58% 59.5%,transparent 59.5%);color-scheme:light}
:root[data-skin="pink"],.sw[data-skin="pink"]{--bg:#FCE4EE;--onbg:#4A1530;--onbgm:#8E4E6C;--card:#FFFFFF;--ink:#3A1226;--muted:#8A5A70;--line:#F3D3E0;--soft:#FBEAF1;--court:#D6336C;--court-ink:#FFFFFF;--ball:#D9E04B;--plus:#1F7A4D;--minus:#C2412D;--sheet:#FDF1F6;--sel:#D6336C;--sel-ink:#FFFFFF;--dot:#D6336C;
  --pattern:radial-gradient(circle,rgba(214,51,108,.13) 5px,transparent 6px);--psize:34px 34px;color-scheme:light}
:root[data-skin="mint"],.sw[data-skin="mint"]{--bg:#DDF3EA;--onbg:#0F3B2E;--onbgm:#4C7466;--card:#FFFFFF;--ink:#0F2E25;--muted:#587266;--line:#CFE6DC;--soft:#E8F6F0;--court:#13866B;--court-ink:#FFFFFF;--ball:#D9E04B;--plus:#13866B;--minus:#C2412D;--sheet:#EEF9F4;--sel:#13866B;--sel-ink:#FFFFFF;--dot:#13866B;--psize:auto;
  --pattern:repeating-linear-gradient(135deg,rgba(19,134,107,.06) 0 14px,transparent 14px 28px);color-scheme:light}
:root[data-skin="graphite"],.sw[data-skin="graphite"]{--bg:#15171B;--onbg:#ECEEF1;--onbgm:#9AA0AA;--card:#1F2228;--ink:#ECEEF1;--muted:#9AA0AA;--line:#30343C;--soft:#272B32;--court:#C9D23F;--court-ink:#15170A;--ball:#C9D23F;--plus:#4FBF86;--minus:#EE7A63;--sheet:#1A1D22;--sel:#C9D23F;--sel-ink:#15170A;--dot:#C9D23F;--psize:auto;
  --pattern:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.05) 0 calc(50% + 1px),transparent 0),linear-gradient(180deg,transparent calc(40% - 1px),rgba(255,255,255,.05) 0 calc(40% + 1px),transparent 0);color-scheme:dark}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <div class="sub" id="status"></div>

  <!-- DAY -->
  <section id="vDay">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="dayhead"><h1 id="dTitle"></h1><div style="display:flex;gap:6px;flex:none"><button class="mini" id="dToday">Сегодня</button><button class="mini" id="dSkin" aria-label="Сменить тему">🎨</button></div></div>
      <div class="week" id="week"></div>

<script>
// ---------- helpers ----------
const KEY='kassa-trenera-v1';
const TAX=0.04;
const pad=n=>String(n).padStart(2,'0');
const D=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>D(new Date());
const addDays=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return D(d)};
const monStart=s=>{const d=P(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return D(d)};
const nowHour=()=>pad(new Date().getHours())+':00';
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MON_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_S=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MON_N=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const WDF=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return (+d)+' '+MON_S[+m-1]+(y!==today().slice(0,4)?' '+y:'')};
const rub=n=>{const v=Math.round(n||0);return (v<0?'−':'')+new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.abs(v))+' ₽'};
const _rc=Element.prototype.replaceChildren;Element.prototype.replaceChildren=function(...k){return _rc.apply(this,k.flat().filter(x=>x!=null&&x!==false))};
const _ap=Element.prototype.append;Element.prototype.append=function(...k){return _ap.apply(this,k.flat().filter(x=>x!=null&&x!==false))};
const signed=n=>(n>0?'+':n<0?'−':'')+rub(Math.abs(n));
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<12||m100>14))?b:c};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const $=id=>document.getElementById(id);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?'':v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e};

// ---------- state ----------
const S={clients:[],payments:[],sessions:[],groups:[],plans:[],lastBackup:null,tab:'d',day:today(),showArch:false,folder:'all',per:'month',anchor:today(),from:null,to:null};
function persist(){try{localStorage.setItem(KEY,JSON.stringify({clients:S.clients,payments:S.payments,sessions:S.sessions,groups:S.groups,plans:S.plans,savedAt:new Date().toISOString(),lastBackup:S.lastBackup||null}));return true}catch(e){setStatus('Не удалось сохранить: память браузера недоступна');return false}}
function loadLocal(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);S.clients=d.clients||[];S.payments=d.payments||[];S.sessions=d.sessions||[];S.groups=d.groups||[];S.plans=d.plans||[];S.lastBackup=d.lastBackup||null}}catch(e){setStatus('Память браузера недоступна, записи не сохранятся')}}
async function save(col,id,data){const arr=S[col];const i=id?arr.findIndex(x=>x.id===id):-1;const rec={id:id||uid(),...data};if(i>=0)arr[i]=rec;else arr.push(rec);const ok=persist();render();return ok}
async function del(col,id){S[col]=S[col].filter(x=>x.id!==id);persist();render()}
const strip=o=>{const{id,...r}=o;return r};
function setStatus(t){$('status').textContent=t;$('status').hidden=!t}

// Court price: weekdays 17:00–21:00 → 2500/h, otherwise 1500/h
function courtPrice(date,time,hours){
  if(!date||!time)return 0;const wd=P(date).getDay();const h=+time.split(':')[0];const weekend=wd===0||wd===6;
  return Math.round(((!weekend&&h>=17&&h<21)?2500:1500)*(+hours||1));
}
const clientById=id=>S.clients.find(c=>c.id===id);
const groupById=id=>S.groups.find(g=>g.id===id);
const cname=id=>clientById(id)?.name||'Удалённый клиент';
const gLabel=g=>(g.emoji?g.emoji+' ':'')+g.name;
const sessSum=s=>(s.attendees||[]).reduce((t,a)=>t+(+a.price||0),0);
const sessTitle=s=>{const g=s.groupId&&groupById(s.groupId);if(g)return gLabel(g);return (s.attendees||[]).map(a=>cname(a.clientId)).join(', ')||'Тренировка'};
function balance(id){let b=0;for(const p of S.payments)if(p.clientId===id)b+=+p.amount||0;for(const s of S.sessions)for(const a of(s.attendees||[]))if(a.clientId===id)b-=+a.price||0;return b}
const inR=(d,f,t)=>d&&d>=f&&d<=t;

// ---------- plans (schedule) ----------
const WD_ORDER=[1,2,3,4,5,6,0];
const daysLabel=days=>WD_ORDER.filter(d=>days.includes(d)).map(d=>WD[d]).join(', ');
function planMembers(p){const g=p.groupId&&groupById(p.groupId);const ids=g?S.clients.filter(c=>c.groupId===g.id).map(c=>c.id):(p.clientIds||[]);return ids.filter(id=>{const c=clientById(id);return c&&!c.archived})}
const planTitle=p=>{const g=p.groupId&&groupById(p.groupId);return g?gLabel(g):planMembers(p).map(cname).join(', ')};
const planWhen=p=>p.kind==='once'?'один раз':'каждую неделю: '+daysLabel(p.days||[]);
function planOn(p,ds){if((p.skip||[]).includes(ds))return false;if(p.kind==='once')return p.date===ds;return (p.days||[]).includes(P(ds).getDay())&&ds>=(p.from||'0000')&&(!p.until||ds<=p.until)}
function planDone(p,ds){const m=planMembers(p);return S.sessions.some(s=>s.date===ds&&s.time===p.time&&(s.attendees||[]).some(a=>m.includes(a.clientId)))}
function plansOn(ds){return S.plans.filter(p=>planOn(p,ds)&&planMembers(p).length&&!planDone(p,ds))}
const planExpected=p=>planMembers(p).reduce((t,id)=>t+(+clientById(id)?.price||0),0);

// ---------- period stats ----------
function periodStats(f,t){
  const sess=S.sessions.filter(s=>inR(s.date,f,t));
  const pays=S.payments.filter(p=>inR(p.date,f,t));
  const earned=sess.reduce((a,s)=>a+sessSum(s),0);
  const court=sess.reduce((a,s)=>a+(+s.courtCost||0),0);
  const cash=pays.filter(p=>p.method!=='card').reduce((a,p)=>a+(+p.amount||0),0);
  const card=pays.filter(p=>p.method==='card').reduce((a,p)=>a+(+p.amount||0),0);
  const tax=Math.round(card*TAX);
  return{sess,pays,earned,court,cash,card,tax,net:earned-court-tax};
}

// ---------- render: day ----------
function renderDay(){
  const d=P(S.day);
  $('dTitle').textContent=(S.day===today()?'Сегодня, ':WDF[d.getDay()]+', ')+d.getDate()+' '+MON_GEN[d.getMonth()]+(S.day.slice(0,4)!==today().slice(0,4)?' '+S.day.slice(0,4):'');
  $('dToday').hidden=S.day===today();
  const ws=monStart(S.day);const W=$('week');W.replaceChildren(el('button',{class:'arr','aria-label':'Прошлая неделя',onclick:()=>{S.day=addDays(S.day,-7);renderDay()}},'‹'));
  for(let i=0;i<7;i++){const ds=addDays(ws,i);const has=S.sessions.some(s=>s.date===ds);const planned=!has&&plansOn(ds).length>0;
    W.append(el('button',{class:'wd'+(ds===S.day?' sel':'')+(ds===today()?' today':'')+(has?' has':'')+(planned?' planned':''),'aria-label':fmtDate(ds),onclick:()=>{S.day=ds;renderDay()}},el('small',{},WD[(i+1)%7]),el('b',{},P(ds).getDate()),el('i')))}
  W.append(el('button',{class:'arr','aria-label':'Следующая неделя',onclick:()=>{S.day=addDays(S.day,7);renderDay()}},'›'));
  const plans=plansOn(S.day);
  const items=[...S.sessions.filter(s=>s.date===S.day).map(s=>({t:s.time||'',s})),...plans.map(p=>({t:p.time||'',p}))].sort((a,b)=>a.t.localeCompare(b.t));
  const T=$('timeline');T.replaceChildren();
  if(!items.length)T.append(el('div',{class:'list'},el('div',{class:'empty'},'В этот день ничего нет. Запланируйте тренировку или запишите проведённую.')));
  for(const it of items){
    if(it.p){const p=it.p;const m=planMembers(p);const exp=planExpected(p);
      T.append(el('div',{class:'tli plan'},el('div',{class:'t'},p.time||'—'),el('div',{class:'rail'},el('span',{class:'dot','aria-hidden':'true'}),el('span',{class:'ln'})),
        el('button',{class:'tcard plan',onclick:()=>openPlanItem(p,S.day)},el('div',{class:'main'},el('div',{class:'name'},planTitle(p)),el('div',{class:'sub'},'по плану · '+String(p.hours||1).replace('.',',')+' ч'+(p.groupId&&m.length?' · '+m.length+' чел.':''))),
          exp?el('div',{class:'sub num'},'≈ '+rub(exp)):null)));continue}
    const s=it.s;const sum=sessSum(s);const n=(s.attendees||[]).length;
    const subParts=[];if(s.groupId)subParts.push(n+' '+plural(n,'человек','человека','человек'));else if(n>1)subParts.push(n+' чел.');
    subParts.push((String(s.hours||1).replace('.',','))+' ч');if(s.courtCost)subParts.push('корт '+rub(s.courtCost));
    T.append(el('div',{class:'tli'},el('div',{class:'t'},s.time||'—'),el('div',{class:'rail'},el('span',{class:'dot','aria-hidden':'true'},'✓'),el('span',{class:'ln'})),
      el('button',{class:'tcard',onclick:()=>openSession({edit:s})},el('div',{class:'main'},el('div',{class:'name'},sessTitle(s)),el('div',{class:'sub'},subParts.join(' · '))),
        el('div',{style:'text-align:right'},el('div',{class:'num bal pos'},'+'+rub(sum)),s.courtCost?el('div',{class:'sub num'},'чистыми '+rub(sum-s.courtCost)):null))))}
  const st=periodStats(S.day,S.day);
  const expAll=plans.reduce((t,p)=>t+planExpected(p),0);
  $('daySum').replaceChildren(
    plans.length?el('span',{class:'sub',style:'grid-column:1/-1'},'Запланировано ещё '+plans.length+' '+plural(plans.length,'тренировка','тренировки','тренировок')+(expAll?' · ожидается ≈ '+rub(expAll):'')):null,
    el('span',{class:'sub'},'Итого за день · '+st.sess.length+' '+plural(st.sess.length,'тренировка','тренировки','тренировок')),el('span'),
    el('span',{},'Заработано'),el('span',{class:'num'},rub(st.earned)),
    el('span',{},'Аренда корта'),el('span',{class:'num'},st.court?'−'+rub(st.court):'0 ₽'),
    el('span',{style:'font-weight:600'},'Чистыми'),el('span',{class:'num big-v'},rub(st.earned-st.court)),
    st.cash||st.card?el('span',{class:'sub',style:'grid-column:1/-1'},'Получено денег: наличными '+rub(st.cash)+', переводом '+rub(st.card)):null);
}

// ---------- render: clients ----------
function renderClients(){
  const F=$('folders');F.replaceChildren();
  const opts=[['all','Все'],...S.groups.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(g=>[g.id,gLabel(g)])];
  if(S.groups.length)opts.push(['none','Без папки']);
  if(!opts.some(o=>o[0]===S.folder))S.folder='all';
  F.hidden=!S.groups.length;
  for(const[v,t]of opts)F.append(el('button',{'aria-pressed':String(S.folder===v),onclick:()=>{S.folder=v;renderClients()}},t));
  const q=$('search').value.trim().toLowerCase();
  const base=S.clients.filter(c=>!!c.archived===S.showArch&&(!q||c.name.toLowerCase().includes(q)));
  const sections=[];
  const sortG=S.groups.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  for(const g of sortG)if(S.folder==='all'||S.folder===g.id)sections.push({g,items:base.filter(c=>c.groupId===g.id)});
  if(S.folder==='all'||S.folder==='none')sections.push({g:null,items:base.filter(c=>!c.groupId||!groupById(c.groupId))});
  const box=$('clientGroups');box.replaceChildren();
  let total=0;
  for(const{g,items}of sections){
    if(!items.length&&(!g||q||S.showArch))continue;total+=items.length;
    const wrap=el('div',{style:'display:flex;flex-direction:column;gap:6px'});
    if(S.groups.length)wrap.append(g?el('button',{class:'ghead',onclick:()=>openGroupForm(g)},el('h2',{},gLabel(g)),el('span',{class:'sub'},items.length+' · изменить')):el('div',{class:'ghead'},el('h2',{},'Без папки'),el('span',{class:'sub'},String(items.length))));
    const L=el('div',{class:'list'});
    if(!items.length)L.append(el('div',{class:'empty'},'В папке пока никого. Нажмите на название папки, чтобы добавить клиентов.'));
    items.map(c=>({c,b:balance(c.id)})).sort((a,b)=>{const da=a.b<0,dbb=b.b<0;if(da!==dbb)return da?-1:1;return a.c.name.localeCompare(b.c.name,'ru')}).forEach(({c,b})=>{
      L.append(el('button',{class:'row',onclick:()=>openClient(c.id)},
        el('div',{class:'main'},el('div',{class:'name'},c.name),el('div',{class:'sub'},c.price?('обычно '+rub(c.price)):'цена не задана',c.note?' · '+c.note:'')),
        el('div',{style:'text-align:right'},el('div',{class:'bal num '+(b>0?'pos':b<0?'neg':'zero')},b===0?'0 ₽':signed(b)),b<0?el('span',{class:'pill debt'},'долг'):null)))});
    wrap.append(L);box.append(wrap);
  }
  if(!total&&!box.children.length)box.append(el('div',{class:'list'},el('div',{class:'empty'},S.showArch?'В архиве пусто.':q?'Никого не нашла.':'Клиентов пока нет. Нажмите «+ Клиент» и укажите имя и обычную цену тренировки.')));
  const archN=S.clients.filter(c=>c.archived).length;const t=$('toggleArch');
  t.hidden=!archN&&!S.showArch;t.textContent=S.showArch?'← Активные клиенты':'Архив ('+archN+')';
}

// ---------- render: stats ----------
const PERS=[['day','День'],['week','Неделя'],['month','Месяц'],['year','Год'],['custom','Период']];
function range(){const a=S.anchor;switch(S.per){
  case'day':return[a,a];
  case'week':{const f=monStart(a);return[f,addDays(f,6)]}
  case'month':{const[y,m]=a.split('-').map(Number);return[y+'-'+pad(m)+'-01',D(new Date(y,m,0))]}
  case'year':{const y=a.slice(0,4);return[y+'-01-01',y+'-12-31']}
  default:{let f=S.from||addDays(today(),-29),t=S.to||today();if(f>t)[f,t]=[t,f];return[f,t]}}}
function shiftPer(n){const a=S.anchor;
  if(S.per==='day')S.anchor=addDays(a,n);else if(S.per==='week')S.anchor=addDays(a,7*n);
  else if(S.per==='month'){const d=P(a);d.setDate(1);d.setMonth(d.getMonth()+n);S.anchor=D(d)}
  else if(S.per==='year')S.anchor=(+a.slice(0,4)+n)+'-01-01';renderStats()}
function perTitle(f,t){const a=P(f),b=P(t);
  if(S.per==='day')return (f===today()?'Сегодня, ':'')+a.getDate()+' '+MON_GEN[a.getMonth()]+' '+a.getFullYear();
  if(S.per==='month')return MONTHS[a.getMonth()]+' '+a.getFullYear();
  if(S.per==='year')return String(a.getFullYear());
  return a.getDate()+' '+MON_GEN[a.getMonth()]+' – '+b.getDate()+' '+MON_GEN[b.getMonth()]+' '+b.getFullYear()}
function buckets(f,t){const days=Math.round((P(t)-P(f))/864e5)+1;const out=[];
  if(S.per==='year'||(S.per==='custom'&&days>62)){let d=P(f);d.setDate(1);while(D(d)<=t){const k=D(d).slice(0,7);out.push({key:k,label:MON_N[d.getMonth()],month:true});d.setMonth(d.getMonth()+1)}return out}
  if(days<=1)return null;
  for(let i=0;i<days;i++){const ds=addDays(f,i);const dd=P(ds);out.push({key:ds,label:days<=7?WD[dd.getDay()]:String(dd.getDate())})}return out}
function renderStats(){
  $('perSeg').replaceChildren(...PERS.map(([v,t])=>el('button',{'aria-pressed':String(S.per===v),onclick:()=>{S.per=v;if(v!=='custom')S.anchor=S.anchor||today();renderStats()}},t)));
  const custom=S.per==='custom';$('customRange').hidden=!custom;$('pPrev').hidden=custom;$('pNext').hidden=custom;
  const[f,t]=range();if(custom){$('cFrom').value=f;$('cTo').value=t}
  $('pTitle').textContent=perTitle(f,t);
  const st=periodStats(f,t);const n=st.sess.length;
  $('tiles').replaceChildren(
    el('div',{class:'tile net'},el('span',{class:'lab'},'Чистыми'),el('span',{class:'val num'},rub(st.net)),el('span',{class:'lab'},'заработано − аренда кортов − налог 4% с переводов')),
    el('div',{class:'tile'},el('span',{class:'lab'},'Тренировок'),el('span',{class:'val num'},String(n)),el('span',{class:'formula'},st.sess.reduce((a,s)=>a+(s.attendees||[]).length,0)+' посещений')),

function openPayment({clientId,edit}={}){
  openSheet(box=>{
    const active=S.clients.filter(c=>!c.archived||c.id===(edit?.clientId||clientId)).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    if(!active.length){box.append(head('Оплата'),el('div',{class:'empty'},'Сначала добавьте клиента.'),el('button',{class:'save',onclick:()=>openClientForm()},'+ Новый клиент'));return}
    const sel=el('select',{id:'pfClient'},active.map(c=>el('option',{value:c.id},c.name)));sel.value=edit?.clientId||clientId||active[0].id;
    const amt=el('input',{id:'pfAmt',type:'number',inputmode:'numeric',value:edit?.amount||'',placeholder:'Сумма'});
    let method=edit?.method||'cash';
    const rc=el('input',{id:'pfRc',type:'checkbox'});rc.checked=!!edit?.receipt;
    const rcWrap=el('div',{style:'display:flex;flex-direction:column;gap:8px'});
    const copyBtn=el('button',{class:'mini',onclick:async()=>{try{await navigator.clipboard.writeText('Услуги тренера по теннису');copyBtn.textContent='Скопировано'}catch{copyBtn.textContent='Выделите текст'}}},'Копировать');
    rcWrap.append(el('label',{class:'toggle',for:'pfRc'},el('span',{},'Чек в «Мой налог» пробит'),rc),el('div',{class:'copy'},el('code',{},'Услуги тренера по теннису'),copyBtn));
    const seg=el('div',{class:'seg'});const drawSeg=()=>{seg.replaceChildren(...[['cash','Наличные'],['card','Перевод']].map(([v,t])=>el('button',{'aria-pressed':String(method===v),onclick:()=>{method=v;drawSeg()}},t)));rcWrap.hidden=method!=='card'};drawSeg();
    const date=el('input',{id:'pfDate',type:'date',value:edit?.date||today()});
    const note=el('input',{id:'pfNote',value:edit?.note||'',placeholder:'например, абонемент 8 занятий'});
    const quick=el('div',{class:'chips'});const drawQuick=()=>{const p=clientById(sel.value)?.price;quick.replaceChildren(...(p?[1,4,8,10].map(n=>el('button',{onclick:()=>{amt.value=p*n}},n===1?rub(p):n+' × '+rub(p))):[]))};drawQuick();sel.onchange=drawQuick;
    const err=el('div',{class:'err'});
    box.append(head(edit?'Оплата':'Новая оплата'),
      el('div',{class:'field'},el('label',{for:'pfClient'},'Клиент'),sel),
      el('div',{class:'field'},el('label',{for:'pfAmt'},'Сумма, ₽'),amt,quick),
      el('div',{class:'field'},el('span',{class:'flabel'},'Как заплатил'),seg),rcWrap,
      el('div',{class:'field'},el('label',{for:'pfDate'},'Дата'),date),
      el('div',{class:'field'},el('label',{for:'pfNote'},'Комментарий'),note),err,
      el('button',{class:'save',onclick:async e=>{if(!(+amt.value>0)){err.textContent='Впишите сумму.';return}e.currentTarget.disabled=true;
        const ok=await save('payments',edit?.id,{clientId:sel.value,amount:+amt.value,method,date:date.value||today(),receipt:method==='card'?rc.checked:false,note:note.value.trim()});
        if(ok)openClient(sel.value);else e.currentTarget.disabled=false}},'Сохранить оплату'),
      edit?dangerBtn('Удалить оплату',()=>del('payments',edit.id)):null);
    if(!edit)setTimeout(()=>amt.focus(),50);
  });
}

// session
function openSession({clientId,edit,date:presetDate,preset}={}){
  openSheet(box=>{
    const pool=S.clients.filter(c=>!c.archived||(edit?.attendees||[]).some(a=>a.clientId===c.id)).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    if(!pool.length){box.append(head('Тренировка'),el('div',{class:'empty'},'Сначала добавьте клиента.'),el('button',{class:'save',onclick:()=>openClientForm()},'+ Новый клиент'));return}
    const att=new Map((edit?.attendees||[]).map(a=>[a.clientId,a.price]));
    let groupId=edit?.groupId||preset?.groupId||null;
    if(clientId&&!edit)att.set(clientId,clientById(clientId)?.price||0);
    if(preset)(preset.clientIds||[]).forEach(id=>att.set(id,clientById(id)?.price||0));
    const d0=edit?.date||preset?.date||presetDate||today();
    const date=el('input',{id:'sfDate',type:'date',value:d0});
    const time=el('input',{id:'sfTime',type:'time',step:'900',value:edit?.time||preset?.time||(d0===today()?nowHour():'10:00')});
    let hours=edit?.hours||preset?.hours||1;
    const hseg=el('div',{class:'seg'});
    const court=el('input',{id:'sfCourt',type:'checkbox'});court.checked=edit?(+edit.courtCost>0):true;
    const cost=el('input',{id:'sfCost',type:'number',inputmode:'numeric'});let costTouched=!!edit;cost.value=edit?(edit.courtCost||''):courtPrice(date.value,time.value,hours);
    cost.oninput=()=>{costTouched=true};
    const recalc=()=>{if(!costTouched)cost.value=courtPrice(date.value,time.value,hours)};
    const drawH=()=>hseg.replaceChildren(...[1,1.5,2].map(h=>el('button',{'aria-pressed':String(hours===h),onclick:()=>{hours=h;costTouched=false;drawH();recalc()}},String(h).replace('.',',')+' ч')));drawH();
    date.onchange=()=>{costTouched=false;recalc()};time.onchange=()=>{costTouched=false;recalc()};
    const costWrap=el('div',{class:'field'},el('label',{for:'sfCost'},'Аренда корта, ₽'),cost,el('span',{class:'sub'},'Считается сама: будни 17–21 — 2500 ₽/ч, остальное — 1500 ₽/ч.'));
    court.onchange=()=>{costWrap.hidden=!court.checked};costWrap.hidden=!court.checked;
    const gch=el('div',{class:'chips groups'});const chips=el('div',{class:'chips'});const rows=el('div',{style:'display:flex;flex-direction:column;gap:6px'});
    const groupsWithMembers=S.groups.filter(g=>S.clients.some(c=>c.groupId===g.id&&!c.archived)).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    const draw=()=>{
      gch.replaceChildren(...groupsWithMembers.map(g=>el('button',{'aria-pressed':String(groupId===g.id),onclick:()=>{if(groupId===g.id){groupId=null}else{groupId=g.id;S.clients.filter(c=>c.groupId===g.id&&!c.archived).forEach(c=>{if(!att.has(c.id))att.set(c.id,c.price||0)})}draw()}},gLabel(g))));
      chips.replaceChildren(...pool.map(c=>el('button',{'aria-pressed':String(att.has(c.id)),onclick:()=>{att.has(c.id)?att.delete(c.id):att.set(c.id,c.price||0);draw()}},c.name)));
      rows.replaceChildren(...[...att.entries()].map(([id,price])=>{const i=el('input',{type:'number',inputmode:'numeric',value:price,'aria-label':'Цена для '+cname(id),id:'sfP_'+id});i.oninput=()=>{att.set(id,+i.value||0);tot()};return el('div',{class:'att'},el('span',{},cname(id)),i,el('span',{class:'sub'},'₽'))}));tot()};
    const total=el('div',{class:'sub num',style:'text-align:right'});
    const tot=()=>{const s=[...att.values()].reduce((a,b)=>a+(+b||0),0);total.textContent=att.size?'Итого с тренировки: '+rub(s):''};
    draw();
    const err=el('div',{class:'err'});
    box.append(head(edit?'Тренировка':'Провела тренировку'),
      groupsWithMembers.length?el('div',{class:'field'},el('span',{class:'flabel'},'Группа целиком'),gch):null,
      el('div',{class:'field'},el('span',{class:'flabel'},'Кто был'),chips),rows,total,
      el('div',{class:'two'},el('div',{class:'field'},el('label',{for:'sfDate'},'Дата'),date),el('div',{class:'field'},el('label',{for:'sfTime'},'Начало'),time)),
      el('div',{class:'field'},el('span',{class:'flabel'},'Длительность'),hseg),
      el('label',{class:'toggle',for:'sfCourt'},el('span',{},'Корт оплачиваю я'),court),costWrap,err,
      el('button',{class:'save',onclick:async e=>{if(!att.size){err.textContent='Отметьте хотя бы одного клиента.';return}e.currentTarget.disabled=true;
        const attendees=[...att.entries()].map(([cid,price])=>({clientId:cid,price:+price||0}));
        const gKeep=groupId&&attendees.some(a=>clientById(a.clientId)?.groupId===groupId)?groupId:null;
        const ok=await save('sessions',edit?.id,{date:date.value||today(),time:time.value||'',hours,courtCost:court.checked?(+cost.value||0):0,attendees,groupId:gKeep});
        if(ok){S.day=date.value||today();if(attendees.length===1&&!gKeep)openClient(attendees[0].clientId);else{closeSheet();setTab('d')}}else e.currentTarget.disabled=false}},'Сохранить и списать'),
      edit?dangerBtn('Удалить тренировку',()=>del('sessions',edit.id)):null);
  });
}

// ---------- nav ----------
function setTab(t){S.tab=t;$('vDay').hidden=t!=='d';$('vClients').hidden=t!=='c';$('vStats').hidden=t!=='s';
  [['tD','d'],['tC','c'],['tS','s']].forEach(([id,v])=>$(id).setAttribute('aria-selected',String(t===v)));
  if(t==='d')renderDay();window.scrollTo(0,0)}
$('tD').onclick=()=>setTab('d');$('tC').onclick=()=>setTab('c');$('tS').onclick=()=>setTab('s');
$('qTrain').onclick=()=>openSession(S.tab==='d'?{date:S.day}:{});$('qPay').onclick=()=>openPayment();
$('dAdd').onclick=()=>openSession({date:S.day});$('dPlan').onclick=()=>openPlanForm(null,{date:S.day});
$('dToday').onclick=()=>{S.day=today();renderDay()};
$('addClient').onclick=()=>openClientForm();$('addGroup').onclick=()=>openGroupForm();
$('toggleArch').onclick=()=>{S.showArch=!S.showArch;renderClients()};
$('search').oninput=renderClients;
$('pPrev').onclick=()=>shiftPer(-1);$('pNext').onclick=()=>shiftPer(1);
$('cFrom').onchange=()=>{S.from=$('cFrom').value;renderStats()};$('cTo').onchange=()=>{S.to=$('cTo').value;renderStats()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});

// ---------- backup ----------
$('bkSave').onclick=async()=>{
  const data=JSON.stringify({app:'kassa-trenera',version:2,exportedAt:new Date().toISOString(),clients:S.clients,payments:S.payments,sessions:S.sessions,groups:S.groups,plans:S.plans},null,1);
  const name='kassa-'+today()+'.json';const file=new File([data],name,{type:'application/json'});
  let done=false;
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Касса тренера — копия'});done=true}}catch(e){if(e.name==='AbortError')return}
  if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
  S.lastBackup=new Date().toISOString();persist();renderStats();
};
let armedFile=null;
$('bkLoad').onclick=()=>$('bkFile').click();
$('bkFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;$('bkErr').textContent='';
  try{const d=JSON.parse(await f.text());if(d.app!=='kassa-trenera'||!Array.isArray(d.clients))throw 0;
    const n=d.clients.length;
    if(S.clients.length&&armedFile!==f.name){armedFile=f.name;$('bkErr').textContent='В файле '+n+' '+plural(n,'клиент','клиента','клиентов')+'. Текущие записи будут заменены. Выберите файл ещё раз, чтобы подтвердить.';return}
    armedFile=null;S.clients=d.clients;S.payments=d.payments||[];S.sessions=d.sessions||[];S.groups=d.groups||[];S.plans=d.plans||[];persist();render();setTab('c');$('bkErr').textContent=''}
  catch(err){$('bkErr').textContent='Это не файл копии кассы. Выберите файл kassa-….json.'}
};

// ---------- themes ----------
const SKINS=[['classic','Классика','светлая или тёмная, как в телефоне','#2F5DA8'],['hard','Хард','синий корт, как на US Open','#1F4E8C'],['clay','Грунт','оранжевый корт Ролан Гаррос','#C2603A'],['grass','Трава','полосатый газон Уимблдона','#2F6B3A'],['ao','Австралия','ярко-синий корт Мельбурна','#0A86CF'],['night','Вечерний матч','тёмная, со светом прожекторов','#0B1430'],['ball','Мяч','лимонный теннисный мяч','#DDEB47'],['pink','Розовая','нежная, в горошек','#FCE4EE'],['mint','Мятная','спокойная, в полоску','#DDF3EA'],['graphite','Графит','тёмная строгая','#15171B']];
const SKIN_KEY='kassa-skin';
function applySkin(id){const r=document.documentElement;if(!id||id==='classic')delete r.dataset.skin;else r.dataset.skin=id;
  const sk=SKINS.find(x=>x[0]===(id||'classic'))||SKINS[0];const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=sk[3];
  const n=$('skinName');if(n)n.textContent=sk[1]}
function currentSkin(){try{return localStorage.getItem(SKIN_KEY)||'classic'}catch(e){return 'classic'}}
function openSkins(){openSheet(box=>{const draw=()=>{const curS=currentSkin();box.replaceChildren(head('Тема'),
  el('div',{class:'swgrid'},SKINS.map(([id,name,desc])=>el('button',{class:'sw','data-skin':id,'aria-pressed':String(curS===id),onclick:()=>{try{localStorage.setItem(SKIN_KEY,id)}catch(e){}applySkin(id);draw()}},
    el('span',{class:'swt'},desc),el('span',{class:'swc'},name,el('span',{class:'swd'}))))),
  el('span',{class:'sub'},'Тема меняется сразу и запоминается на этом телефоне.'))};draw()})}
$('dSkin').onclick=openSkins;$('sSkin').onclick=openSkins;
applySkin(currentSkin());

// ---------- start ----------
loadLocal();render();setTab('d');
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
