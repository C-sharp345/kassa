*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
body{ font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif; padding-bottom:calc(68px + env(safe-area-inset-bottom)); }
header{ position:sticky; top:0; z-index:20; background:var(--acc2); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; display:flex; align-items:center; gap:10px; }
:root[data-theme="dark"] header{ background:#10302A; } @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) header{ background:#10302A; } }
header h1{ font-size:17px; margin:0; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header .sub{ font-size:12px; opacity:.8; font-weight:500; }
header button{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:10px; height:36px; min-width:36px; padding:0 10px; font-size:15px; }
main{ padding:12px 12px 24px; max-width:760px; margin:0 auto; }
nav.tabs{ position:fixed; bottom:0; left:0; right:0; z-index:30; background:var(--card); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); }
nav.tabs button{ flex:1; background:none; border:0; color:var(--mute); padding:7px 2px 6px; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:2px; }
nav.tabs button svg{ width:24px; height:24px; }
nav.tabs button.on{ color:var(--acc); font-weight:700; }
.card{ background:var(--card); border-radius:14px; padding:14px; margin:0 0 12px; box-shadow:var(--shadow); border:1px solid var(--line); }
.card h2{ font-size:16px; margin:0 0 8px; }
.card h3{ font-size:14px; margin:12px 0 6px; color:var(--mute); text-transform:uppercase; letter-spacing:.04em; }
.row{ display:flex; gap:8px; align-items:center; }
.row > *{ flex:1; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
label.f{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mute); }
label.f > input, label.f > select, label.f > .row{ margin-top:auto; }
label.f span.u{ color:var(--mute); opacity:.8; }
input,select,textarea{ font:inherit; font-size:16px; color:var(--ink); background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:9px 10px; width:100%; min-width:0; }
input:focus,select:focus,textarea:focus{ outline:2px solid var(--acc); outline-offset:0; background:var(--card); }
input.filled{ background:var(--accsoft); border-color:var(--acc); }
input.calc{ border-style:dashed; }
textarea{ min-height:80px; resize:vertical; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:12px; padding:11px 14px; font:inherit; font-weight:600; background:var(--acc); color:var(--onacc); min-height:44px; }
.btn.sec{ background:var(--accsoft); color:var(--acc2); } :root[data-theme="dark"] .btn.sec{ color:var(--acc2); }

.btn.danger{ background:var(--badsoft); color:var(--bad); }
.btn.sm{ min-height:34px; padding:6px 10px; font-size:13px; border-radius:10px; }
.btn.wide{ width:100%; }
.btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.btns .btn{ flex:1; }
.muted{ color:var(--mute); } .small{ font-size:12.5px; } .tiny{ font-size:11.5px; }
.res{ background:var(--soft); border-radius:12px; padding:10px 12px; margin-top:10px; }

.alert b{ display:block; }

.li{ display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line); }
.li:last-child{ border-bottom:0; }

.seg{ display:flex; background:var(--soft); border-radius:12px; padding:3px; gap:3px; margin-bottom:10px; }
.seg button{ flex:1; border:0; background:none; font:inherit; font-size:13.5px; padding:8px 4px; border-radius:9px; color:var(--mute); }

.tbl th{ font-size:11.5px; color:var(--mute); font-weight:600; position:sticky; top:0; background:var(--card); }
.tbl td.n{ text-align:right; font-variant-numeric:tabular-nums; }
.scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }

.grp{ margin-top:12px; } .grp > .gt{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--acc); margin:0 0 6px; }

.empty{ text-align:center; color:var(--mute); padding:22px 8px; font-size:14px; }
details.calc{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; box-shadow:var(--shadow); }

details.calc > .body{ padding:0 14px 14px; }
details.calc[open] > summary{ border-bottom:1px solid var(--line); margin-bottom:12px; }
.chart{ width:100%; height:170px; display:block; }
.note{ font-size:12.5px; color:var(--mute); margin-top:8px; }
.badge-n{ min-width:20px; height:20px; border-radius:10px; background:var(--bad); color:#fff; font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
.hl{ background:var(--warnsoft); }
.printonly{ display:none; }

}

  { k: 'sand', l: 'Песок', u: '%', g: 'Твёрдая фаза', syn: ['песок', 'sand'] },
  { k: 'mbt', l: 'МБТ', u: 'кг/м³', g: 'Твёрдая фаза', syn: ['мбт', 'mbt', 'мвт'] },
  { k: 'es', l: 'ЭС', u: 'В', g: 'РУО', sys: 'РУО', syn: ['эл\\.?\\s?стаб\\S*', 'эс', 'es'] },
  { k: 'pom', l: 'Pom', u: 'мл', g: 'РУО', sys: 'РУО', syn: ['pom', 'ром'] },
  { k: 'temp', l: 't выход', u: '°C', g: 'Прочее', syn: ['темп\\S*', 't\\s?вых\\S*', 't', 'т°'] },
  { k: 'depth', l: 'Забой', u: 'м', g: 'Прочее', syn: ['забой', 'глуб\\S*', 'h'] },
];
const PK = Object.fromEntries(P.map(p => [p.k, p]));
const KEYP = ['dens', 'fv', 'pv', 'yp', 'gel', 'fl', 'ph', 'cl', 'ca', 'solids', 'es', 'kcl'];
const ypU = () => S.settings.ypUnit;
function unitOf(p) { return p.u === 'YP' ? ypU() : p.u; }

function derived(r) { // расчётные величины по записи
  const v = r.v || {}, o = {};
  const R6 = num(v.r600), R3 = num(v.r300);
  if (has(R6) && has(R3)) {
    o.pv = R6 - R3; const ypLb = R3 - o.pv;
    o.yp = ypU() === 'дПа' ? ypLb * 4.79 : ypU() === 'Па' ? ypLb * 0.479 : ypLb;
  }
  const w = num(v.water), oil = num(v.oil);
  if (has(w) && has(oil) && w + oil > 0) o.owr = `${Math.round(oil / (oil + w) * 100)}/${Math.round(w / (oil + w) * 100)}`;
  if (r.sys === 'РУО' && has(num(v.pom))) o.lime = 3.69 * num(v.pom);
  if (r.sys !== 'РУО' && has(num(v.pm)) && has(num(v.pf))) { const fw = has(w) ? w / 100 : NaN; if (has(fw)) o.lime = 0.742 * (num(v.pm) - num(v.pf) * fw); }
  return o;
}
function disp(r, k) { const raw = r.v?.[k]; if (k !== 'gel' && raw !== undefined && raw !== '') return String(raw).replace('.', ','); const x = val(r, k); return x === '' || x === undefined || (typeof x === 'number' && !has(x)) ? '' : typeof x === 'number' ? fmt(x, 2) : x; }
function val(r, k) { const v = r.v || {}; if (k === 'gel') return (v.g10s || v.g10m) ? `${v.g10s ?? '—'}/${v.g10m ?? '—'}` : ''; if (has(num(v[k]))) return num(v[k]); const d = derived(r); return d[k]; }

let mudChart = 'dens';
function renderMud() {

    h += `<div class="card"><div class="chips">${opts.map(([k, t]) => `<button class="chip ${mudChart === k ? 'on' : ''}" data-act="mudChart" data-k="${k}">${t}</button>`).join('')}</div>${chartSVG(recs.slice().reverse(), mudChart)}</div>`;

    h += `<div class="li" data-act="mudEdit" data-id="${r.id}"><div class="main"><div class="t">${esc(r.time || '')} · ${esc(r.sys)}${r.point ? ' · ' + esc(r.point) : ''}${has(num(r.v?.depth)) ? ' · ' + fmt(num(r.v.depth), 0) + ' м' : ''}</div><div class="s">${esc(parts.join(' · ') || 'нет данных')}</div>${r.treat ? `<div class="s">🧪 ${esc(r.treat)}</div>` : ''}</div><div class="v">›</div></div>`;
  }

  return h;
}

function chartSVG(recs, k) {
  const pts = recs.map(r => ({ x: r.date + ' ' + (r.time || ''), y: k === 'g10s' ? num(r.v?.g10s) : (typeof val(r, k) === 'number' ? val(r, k) : NaN) })).filter(p => has(p.y)).slice(-30);
  if (pts.length < 2) return `<div class="empty small">Мало данных для графика</div>`;
  const W = 340, H = 160, l = 34, r = 8, t = 10, b = 26;
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y)); if (lo === hi) { lo -= 1; hi += 1; } const padv = (hi - lo) * 0.12; lo -= padv; hi += padv;
  const X = i => l + i * (W - l - r) / (pts.length - 1), Y = y => t + (hi - y) * (H - t - b) / (hi - lo);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const ticks = [lo + padv, (lo + hi) / 2, hi - padv];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="График">
${ticks.map(v => `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l - 4}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="var(--mute)">${fmt(v, 2)}</text>`).join('')}
<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i === pts.length - 1 ? 4 : 2.6}" fill="var(--acc)"><title>${esc(p.x)}: ${fmt(p.y, 3)}</title></circle>`).join('')}
<text x="${l}" y="${H - 8}" font-size="10" fill="var(--mute)">${esc(shortDate(pts[0].x.slice(0, 10)))}</text><text x="${W - r}" y="${H - 8}" font-size="10" text-anchor="end" fill="var(--mute)">${esc(shortDate(pts.at(-1).x.slice(0, 10)))} · ${fmt(pts.at(-1).y, 3)}</text></svg>`;
}

/* ───── распознавание текста ───── */
function parseMud(text) {
  const out = {};
  let t = ' ' + String(text).toLowerCase().replace(/ё/g, 'е').replace(/[‐-–—]/g, '-').replace(/\r/g, '') + ' ';
  t = t.replace(/(\d),(\d)/g, '$1.$2');
  // СНС «10/15» или «снс 10с-4 10м-8»
  let m = t.match(/(?:снс|gel\S*|гел\S*)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*[\/\\|]\s*(\d+(?:\.\d+)?)/);
  if (m) { out.g10s = m[1]; out.g10m = m[2]; t = t.replace(m[0], ' '); }
  else {
    m = t.match(/(?:снс|gel)\s*10\s*(?:с|сек|s)\S*\s*[:=\-]?\s*(\d+(?:\.\d+)?)/); if (m) { out.g10s = m[1]; t = t.replace(m[0], ' '); }
    m = t.match(/(?:снс|gel)?\s*10\s*(?:м|мин|min)\S*\s*[:=\-]?\s*(\d+(?:\.\d+)?)/); if (m) { out.g10m = m[1]; t = t.replace(m[0], ' '); }
  }
  // показания вискозиметра: строка «600-45 300-30 …» или «θ600 45»
  for (const rpm of ['600', '300', '200', '100']) {
    const re = new RegExp(`(?:θ|ф|r|п)?\\s?${rpm}\\s*(?:об\\S*)?\\s*[:=\\-]\\s*(\\d+(?:\\.\\d+)?)`);
    m = t.match(re); if (m) { out['r' + rpm] = m[1]; t = t.replace(m[0], ' '); }
  }
  for (const rpm of ['6', '3']) {
    const re = new RegExp(`(?:θ|ф|r)\\s?${rpm}(?!\\d)\\s*(?:об\\S*)?\\s*[:=\\-]?\\s*(\\d+(?:\\.\\d+)?)`);
    m = t.match(re); if (m) { out['r' + rpm] = m[1]; t = t.replace(m[0], ' '); }
  }
  const skip = new Set(['g10s', 'g10m', 'r600', 'r300', 'r200', 'r100', 'r6', 'r3']);
  const cands = [];
  for (const p of P) { if (skip.has(p.k)) continue; for (const s of p.syn) cands.push({ k: p.k, s }); }
  cands.sort((a, b) => b.s.replace(/\\./g, '').length - a.s.replace(/\\./g, '').length);
  for (const c of cands) {
    if (out[c.k] !== undefined) continue;
    const short = c.s.replace(/\\./g, '').length <= 2;
    const sep = short ? '\\s*[:=\\-]\\s*|\\s+(?=\\d)' : '\\s*[:=\\-]?\\s*';
    const re = new RegExp(`(^|[^a-zа-я0-9])(?:${c.s})(?:${sep})(-?\\d+(?:\\.\\d+)?)`, 'i');
    const mm = t.match(re);
    if (mm) { out[c.k] = mm[2]; t = t.replace(mm[0], mm[1] + ' '); }
  }
  // правдоподобие: плотность 0.8–3, pH ≤ 14
  if (out.dens && (num(out.dens) < 0.7 || num(out.dens) > 3)) delete out.dens;
  if (out.ph && num(out.ph) > 14) delete out.ph;
  return out;
}

function mudPaste() {
  sheet('Из текста или фото', `
<p class="small">Самый надёжный способ для рукописного листа: сфотографируйте лист встроенной камерой телефона, выделите текст (iPhone — «Сканировать текст» / Live Text, Android — Google Объектив → «Текст»), скопируйте и вставьте сюда. Работает без интернета.</p>

<div class="btns"><button class="btn sec" id="ptPaste">Вставить из буфера</button><button class="btn" id="ptGo">Распознать</button></div>
<div class="grp"><div class="gt">Фото → текст в приложении (бета)</div>
<p class="small muted">Хорошо читает печатный текст и аккуратные цифры, рукописный — хуже. Первый запуск нужно сделать при интернете: модуль (~10 МБ) скачается и дальше будет работать без связи.</p>

      if (!keys.length) { $('#ptRes', sh).innerHTML = '<div class="alert warn">Ничего не распознано. Проверьте, что рядом с числами есть подписи (Пл, УВ, ПВ, ДНС, Ф, pH…).</div>'; return; }
      $('#ptRes', sh).innerHTML = `<div class="res"><div class="small muted">Найдено ${keys.length} параметров</div><div class="kv" style="margin-top:6px">${keys.map(k => `<div><small>${esc(PK[k]?.l || k)}</small><b>${esc(r[k])}</b></div>`).join('')}</div></div><div class="btns"><button class="btn" id="ptUse">Открыть в форме замера</button></div>`;
      $('#ptUse', sh).onclick = () => mudForm(null, r);
    };

        st.textContent = 'Распознаю… (10–40 с)';
        const w = await Tesseract.createWorker(['rus', 'eng'], 1, { langPath: 'https://tessdata.projectnaptha.com/4.0.0', logger: m => { if (m.status === 'recognizing text') st.textContent = 'Распознаю… ' + Math.round(m.progress * 100) + '%'; } });
        const { data } = await w.recognize(f); await w.terminate();
        $('#pt', sh).value = data.text; st.textContent = 'Готово. Проверьте текст и нажмите «Распознать».'; go();
      } catch (err) { st.textContent = 'Не получилось: ' + (navigator.onLine ? (err.message || err) : 'нет интернета для первой загрузки модуля') + '. Используйте камеру телефона и вставку текста.'; }
    };
  });
}
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = ok; s.onerror = () => bad(new Error('модуль не загрузился')); document.head.appendChild(s); });
}

/* ───────────── ёмкости ───────────── */
const TT = { rect: 'Прямоугольная', vcyl: 'Цилиндр вертикальный', hcyl: 'Цилиндр горизонтальный' };
const TG = ['Активная', 'Резерв', 'Доливная', 'Химбочка', 'Прочее'];
function tankH(t) { return t.type === 'hcyl' ? num(t.D) : num(t.H); }
function tankVol(t, levelM) { // объём по уровню от дна, м³
  if (!has(levelM)) return NaN; const Hm = tankH(t); let h = Math.max(0, levelM); if (has(Hm)) h = Math.min(h, Hm);

  const sn = lastSnaps();
  h += `<div class="card"><div class="row"><h2 style="margin:0">Объёмы</h2><button class="btn sm" data-act="${S.tanks.length ? 'snapNew' : 'tankNew'}" style="flex:none">＋ ${S.tanks.length ? 'Замер' : 'Ёмкость'}</button></div>`;
  if (sn[0]) { const a = snapTotals(sn[0]), b = sn[1] ? snapTotals(sn[1]) : null; h += `<div class="res"><table><tr><td>${shortDate(sn[0].date)} ${esc(sn[0].time)} · активный</td><td>${fmt(a.act, 1)} м³</td></tr><tr><td>Всего в ёмкостях</td><td>${fmt(a.all, 1)} м³</td></tr>${b ? `<tr><td>Δ к ${shortDate(sn[1].date)} ${esc(sn[1].time)}</td><td>${a.all - b.all > 0 ? '+' : ''}${fmt(a.all - b.all, 1)} м³</td></tr>` : ''}</table></div>`; }
  else h += `<div class="small muted" style="margin-top:6px">${S.tanks.length ? 'Замеров ёмкостей пока нет.' : 'Добавьте ёмкости на вкладке «Ёмкости».'}</div>`;
  h += `</div>`;
  h += `<div class="btns"><button class="btn sec" data-act="moveNew">Приход / расход</button><button class="btn sec" data-act="report">Отчёт для Claude</button></div>`;
  return h;
}

function report() {
  const L = [], w = S.settings.warnDays;
  L.push(`БУРОВОЙ ЖУРНАЛ — отчёт ${ruDate(today())} ${nowTime()}${S.settings.pad ? ', куст ' + S.settings.pad : ''}${S.settings.well ? ', скв. ' + S.settings.well : ''}`);
  const ms = [...S.mud].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).slice(-8);
  if (ms.length) { L.push('', 'РАСТВОР (последние замеры):');
    for (const r of ms) { const d = derived(r); const parts = P.filter(p => r.v?.[p.k] !== undefined).map(p => `${p.l} ${String(r.v[p.k]).replace('.', ',')}${unitOf(p) ? ' ' + unitOf(p) : ''}`); if (d.owr) parts.push('М/В ' + d.owr); if (has(d.lime)) parts.push('изб.извести ' + fmt(d.lime, 1)); L.push(`- ${ruDate(r.date)} ${r.time} ${r.sys} (${r.point}): ${parts.join('; ')}${r.treat ? ' | обработки: ' + r.treat : ''}${r.note ? ' | ' + r.note : ''}`); } }
  const sn = lastSnaps().slice(0, 4).reverse();
  if (sn.length) { L.push('', `ЁМКОСТИ (м³):`); for (const s of sn) { const t = snapTotals(s); L.push(`- ${ruDate(s.date)} ${s.time}: ${S.tanks.map(tk => { const v = tankVol(tk, levelToM(tk, s.l[tk.id])); return has(v) ? `${tk.name} ${fmt(v, 1)}` : null; }).filter(Boolean).join(', ')} | активный ${fmt(t.act, 1)}, всего ${fmt(t.all, 1)}${s.note ? ' | ' + s.note : ''}`); } }
  const st = S.items.map(it => ({ it, q: bal(it.id) })).filter(x => x.q > 1e-6);
  if (st.length) { L.push('', 'СКЛАД — остатки:'); for (const { it, q } of st) L.push(`- ${itemName(it)}: ${fmt(q, 1)} ${it.unit}${it.pack ? ` (${fmt(q / it.pack, 1)} ${it.packName || 'уп.'})` : ''}${nearestExp(it.id) ? ', ближайший срок ' + ruDate(nearestExp(it.id)) : ''}`); }
  const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const mv = S.moves.filter(m => m.date >= since).sort((a, b) => (a.date + a.ts).localeCompare(b.date + b.ts));
  if (mv.length) { L.push('', 'СКЛАД — движение за 7 дней:'); for (const m of mv) { const it = itemById(m.item); const b = S.batches.find(x => x.id === m.batch); L.push(`- ${ruDate(m.date)} ${MT[m.type]}: ${itemName(it)} ${m.qty} ${it?.unit}${b ? ', п.' + (b.no || '—') : ''}${m.well ? ', ' + m.well : ''}${m.note ? ' — ' + m.note : ''}`); } }
  const al = alerts(); if (al.length) { L.push('', `ВНИМАНИЕ (сроки ≤ ${w} дней, минимумы):`); for (const a of al) L.push(`- ${a.t}: ${a.s}`); }
  return L.join('\n');
}
function reportSheet() {
  const t = report();
  sheet('Отчёт для Claude', `<p class="small muted">Скопируйте и отправьте в чат, когда будет связь. Для полной передачи данных — «Файл данных» (его можно приложить к сообщению).</p><textarea id="rp" style="min-height:260px;font-size:13px">${esc(t)}</textarea>
<div class="btns"><button class="btn" id="rpC">Копировать</button><button class="btn sec" id="rpS">Поделиться</button><button class="btn ghost" id="rpJ">Файл данных</button></div>`, sh => {
    $('#rpC', sh).onclick = () => copyText($('#rp', sh).value);
    $('#rpS', sh).onclick = async () => { try { if (navigator.share) await navigator.share({ text: $('#rp', sh).value }); else copyText($('#rp', sh).value); } catch (e) { } };
    $('#rpJ', sh).onclick = exportJSON;
  });
}
function exportJSON() {
  S.settings.lastBackup = today(); save();
  shareOrDownload(`burjournal-${today()}.json`, JSON.stringify(S, null, 1), 'application/json'); render();
}
function importJSON(file, mode) {
  const rd = new FileReader();
  rd.onload = () => {
    let d; try { d = JSON.parse(rd.result); } catch (e) { toast('Файл не читается'); return; }
    if (!d || typeof d !== 'object') { toast('Неверный файл'); return; }
    const lists = ['mud', 'tanks', 'snaps', 'items', 'batches', 'moves', 'docs'];
    if (mode === 'replace') { if (!lists.some(k => Array.isArray(d[k]))) { toast('В файле нет данных приложения'); return; } S = Object.assign(blank(), d); load2(); }
    else { let n = 0; for (const k of lists) { if (!Array.isArray(d[k])) continue; for (const x of d[k]) { if (!x || !x.id) continue; const i = S[k].findIndex(y => y.id === x.id); if (i >= 0) S[k][i] = Object.assign(S[k][i], x); else S[k].push(x); n++; } } if (d.settings) S.settings = Object.assign(S.settings, d.settings); toast(`Добавлено/обновлено записей: ${n}`); }
    save(); closeSheet(); render();
  };
  rd.readAsText(file);
}
function load2() { const keep = S; try { localStorage.setItem(KEY, JSON.stringify(keep)); } catch (e) { } load(); }
function settingsSheet() {
  const st = S.settings;
  sheet('Настройки и данные', `
<div class="grp" style="margin-top:0"><div class="gt">Объект</div><div class="grid2"><label class="f">Куст<input id="se_pad" value="${esc(st.pad)}"></label><label class="f">Скважина<input id="se_well" value="${esc(st.well)}"></label></div></div>
<div class="grp"><div class="gt">Единицы</div><div class="grid2">${Sel('se_yp', 'ДНС и СНС', [['дПа', 'дПа'], ['lb/100ft²', 'lb/100ft²'], ['Па', 'Па']], st.ypUnit)}${Sel('se_lu', 'Уровень в ёмкостях', [['см', 'см'], ['м', 'м']], st.levelUnit)}${F('se_wd', 'Предупреждать о сроках за', st.warnDays, 'дней')}${Sel('se_th', 'Тема', [['auto', 'Как в телефоне'], ['light', 'Светлая'], ['dark', 'Тёмная']], st.theme)}</div></div>
<div class="grp"><div class="gt">Плотности, г/см³</div><div class="grid3">${F('se_ba', 'Барит', st.rho.barite)}${F('se_ch', 'Мел CaCO₃', st.rho.chalk)}${F('se_oi', 'Нефть / основа', st.rho.oil)}${F('se_wa', 'Вода', st.rho.water)}${F('se_kc', 'KCl (сухой)', st.rho.kcl)}${F('se_cc', 'CaCl₂ (сухой)', st.rho.cacl2)}</div>
<div class="grid2" style="margin-top:8px">${F('se_pk', 'KCl в товаре', st.purity.kcl, '%')}${F('se_pc', 'CaCl₂ в товаре', st.purity.cacl2, '%')}</div>
<div class="note">По ПБ: KCl 1,98–1,99 г/см³, KCl ≥ 95 %; CaCl₂ кальцинированный 90–96,5 %, плотность 2,16 (в трёх ПБ указано 2,51 — похоже на ошибку паспорта).</div></div>
<div class="btns"><button class="btn" id="se_s">Сохранить настройки</button></div>
<div class="grp"><div class="gt">Резервная копия и обмен</div><p class="small muted">Все данные хранятся только в этом телефоне. Раз в несколько дней сохраняйте файл данных (в «Файлы», Telegram «Избранное» или облако). Этот же файл можно отправить Claude, а от Claude — получить файл для загрузки.</p>
<div class="btns"><button class="btn sec" data-act2="exp">Сохранить файл данных</button><button class="btn sec" data-act2="rep">Отчёт для Claude</button></div>
<label class="f" style="margin-top:10px">Загрузить файл данных<input type="file" id="se_imp" accept=".json,application/json"></label>
<div class="seg" id="se_mode" style="margin-top:8px"><button class="on" data-v="merge">Добавить к текущим</button><button data-v="replace">Заменить всё</button></div>
<div class="btns"><button class="btn ghost" data-act2="csvm">Журнал CSV</button><button class="btn ghost" data-act2="csvt">Ёмкости CSV</button><button class="btn ghost" data-act2="csvs">Склад CSV</button></div></div>
<div class="grp"><div class="gt">Справка</div><p class="small">Установка на телефон: откройте ссылку в Safari (iPhone) или Chrome (Android) → «Поделиться» → «На экран Домой» / меню ⋮ → «Установить приложение». После первого открытия работает без интернета.</p>
<p class="tiny muted">Буровой журнал v${VERSION} · данные: ${S.mud.length} замеров, ${S.snaps.length} замеров ёмкостей, ${S.moves.length} операций склада</p>
<button class="btn danger sm" id="se_wipe">Стереть все данные</button></div>`, sh => {
    $('#se_s', sh).onclick = () => { st.pad = T('se_pad', sh); st.well = T('se_well', sh); st.ypUnit = $('#se_yp', sh).value; st.levelUnit = $('#se_lu', sh).value; st.warnDays = V('se_wd', sh) || 90; st.theme = $('#se_th', sh).value;
      const r = st.rho; r.barite = V('se_ba', sh) || 4.2; r.chalk = V('se_ch', sh) || 2.7; r.oil = V('se_oi', sh) || 0.86; r.water = V('se_wa', sh) || 1; r.kcl = V('se_kc', sh) || 1.98; r.cacl2 = V('se_cc', sh) || 2.16; st.purity.kcl = V('se_pk', sh) || 95; st.purity.cacl2 = V('se_pc', sh) || 94;
      save(); applyTheme(); closeSheet(); render(); toast('Сохранено'); };
    sh.addEventListener('click', e => { const a = e.target.closest('[data-act2]')?.dataset.act2; if (!a) return; ({ exp: exportJSON, rep: reportSheet, csvm: mudCSV, csvt: tankCSV, csvs: stockCSV })[a](); });
    $('#se_mode', sh).onclick = e => { const b = e.target.closest('button'); if (!b) return; $$('#se_mode button', sh).forEach(x => x.classList.toggle('on', x === b)); };
    $('#se_imp', sh).onchange = e => { const f = e.target.files[0]; if (!f) return; const mode = $('#se_mode .on', sh).dataset.v; if (mode === 'replace') confirmBox('Заменить все данные на данные из файла?', () => importJSON(f, 'replace')); else importJSON(f, 'merge'); };
    $('#se_wipe', sh).onclick = () => confirmBox('Стереть все данные приложения? Сначала сохраните файл данных.', () => { S = blank(); save(); render(); });
  });
}

  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',

};
const TABS = [['home', 'Сводка'], ['mud', 'Раствор'], ['tanks', 'Ёмкости'], ['calc', 'Расчёты'], ['stock', 'Склад']];
let tab = 'home';
function render() {
  const st = S.settings;
  $('#hdr').innerHTML = `<h1>${esc({ home: 'Буровой журнал', mud: 'Журнал раствора', tanks: 'Ёмкости', calc: 'Расчёты', stock: 'Склад и сроки' }[tab])}<div class="sub">${esc([st.pad && 'куст ' + st.pad, st.well && 'скв. ' + st.well].filter(Boolean).join(' · ') || ruDate(today()))}</div></h1><button data-act="settings" aria-label="Настройки">⚙</button>`;
  const openCalcs = $$('details.calc[open]').map(d => d.dataset.calc);
  $('#main').innerHTML = { home: renderHome, mud: renderMud, tanks: renderTanks, calc: renderCalc, stock: renderStock }[tab]();
  if (tab === 'calc') { openCalcs.forEach(id => { const d = $(`[data-calc="${id}"]`); if (d) d.open = true; }); bindCalc(); }
  if (tab === 'tanks') bindTankCalc();

}
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; render(); scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  const acts = {
    settings: settingsSheet, report: reportSheet, backup: settingsSheet,
    mudNew: () => mudForm(), mudPaste, mudEdit: () => mudForm(S.mud.find(x => x.id === id)), mudChart: () => { mudChart = el.dataset.k; render(); }, mudCSV, mudBlank,
    tankNew: () => tankForm(), tankEdit: () => tankForm(S.tanks.find(x => x.id === id)), snapNew: () => snapForm(), snapEdit: () => snapForm(S.snaps.find(x => x.id === id)), tankDay: () => { tankDay = el.dataset.d; render(); }, tankCSV,
    moveNew: () => moveForm(), moveEdit: () => moveForm(S.moves.find(x => x.id === id)), itemOpen: () => itemOpen(id), itemNew, stockView: () => { stockView = el.dataset.v; render(); }, stockOnly: () => { stockOnly = !stockOnly; render(); }, stockCSV, movesCSV,
    docNew: () => docForm(), docEdit: () => docForm(S.docs.find(x => x.id === id)),
  };
  if (acts[a]) acts[a]();
});
load(); applyTheme(); render();
try { navigator.storage?.persist?.(); } catch (e) { }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
